# Surface Pro 11, image without Microsoft's files: read the battery from the embedded controller until the
# audio/sensor DSP firmware is installed. qcom_battmgr reports the battery through that DSP, which does not
# start without its firmware. sp11-firmware-fetch masks this file (an empty /etc/modprobe.d file of the same
# name) once the firmware is in place, so that one battery shows.
# Needs a kernel whose surface_battery has the denali_bind parameter; other kernels ignore the option.
options surface_battery denali_bind=1
