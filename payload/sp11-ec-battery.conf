# Surface Pro 11, image without Microsoft's files: read the battery from the embedded controller until the
# audio/sensor DSP firmware is installed. qcom_battmgr reports the battery through that DSP, which does not
# start without its firmware; it then still registers a battery that cannot be read, and the desktop shows it as
# a second, empty one. So let surface_battery bind and keep qcom_battmgr from loading. sp11-firmware-fetch masks
# this file (an empty /etc/modprobe.d file of the same name) once the firmware is in place.
# denali_bind needs a kernel whose surface_battery has the parameter; other kernels ignore the option.
options surface_battery denali_bind=1
blacklist qcom_battmgr
